<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>エゴ育成ゲーム</title>
<meta name="description" content="じぶんを育てる時間を、タイマーと記録で見える化。かけた時間でキャラが育つ、たまごっち風の自分磨きゲーム。">
<meta name="theme-color" content="#FFC4D6">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFF6F1; --card:#FFFFFF; --ink:#4A3F55; --sub:#8C7F96; --line:#F2E2E8;
  --shell1:#FFD6E2; --shell2:#FFB3C8; --lcd:#E6F0D6; --lcd-ink:#3F4A3A;
  --gold:#E8B84A; --dq:#101018;
  --pixel:"DotGothic16","Zen Maru Gothic",monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){ --bg:#2A2433; --card:#372F42; --ink:#F4EAF2; --sub:#BCAFC6; --line:#4A4057; }
}
:root[data-theme="dark"]{ --bg:#2A2433; --card:#372F42; --ink:#F4EAF2; --sub:#BCAFC6; --line:#4A4057; }
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) .card.toi{background:#443A2E;border-color:#8A7140} }
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Noto Sans JP",system-ui,sans-serif;
  line-height:1.6;-webkit-font-smoothing:antialiased;
  padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
main{max-width:470px;margin:0 auto;padding:16px 16px 40px}
button,select{font-family:inherit;color:inherit}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
[hidden]{display:none!important}

/* ===== たまごっち本体 ===== */
.device{position:relative;width:min(100%,360px);margin:6px auto 4px;padding:17% 15% 7%;
  border-radius:50% 50% 50% 50% / 58% 58% 42% 42%;
  background:radial-gradient(rgba(255,255,255,.55) 2px,transparent 2.6px) 0 0/16px 16px,linear-gradient(165deg,var(--shell1),var(--shell2));
  box-shadow:inset -8px -12px 0 rgba(150,60,100,.10),inset 8px 10px 0 rgba(255,255,255,.55),0 12px 26px rgba(190,100,140,.28)}
.device::before{content:"";position:absolute;left:22%;top:7%;width:18%;height:6%;border-radius:50%;background:rgba(255,255,255,.6);transform:rotate(-18deg)}
.dev-title{position:absolute;left:0;right:0;top:9.5%;text-align:center;font-family:var(--pixel);font-size:.8rem;letter-spacing:.12em;color:#9C4D6E}
.lcd-frame{background:#fff;border-radius:22px;padding:7px;box-shadow:inset 0 2px 0 rgba(0,0,0,.06)}
.lcd{position:relative;background:var(--lcd);color:var(--lcd-ink);border-radius:16px;padding:8px 9px 9px;font-family:var(--pixel);overflow:hidden;
  background-image:linear-gradient(rgba(0,0,0,.035) 1px,transparent 1px);background-size:100% 3px}
.lcd-top{display:flex;justify-content:space-between;font-size:.72rem;line-height:1.3}
.stage-area{position:relative;height:124px;display:flex;align-items:flex-end;justify-content:center}
.pet{width:92px;height:92px;cursor:pointer;margin-bottom:4px}
.pet svg{width:100%;height:100%;display:block}
.pet.hop{animation:hop 1s steps(2) infinite}
.pet.work{animation:hop .5s steps(2) infinite}
.pet.wobble{animation:wobble 1.4s steps(4) infinite}
.pet.sleep{animation:breathe 2.4s steps(2) infinite}
.pet.jump{animation:jump .5s steps(3) 2}
.pet.grump{animation:grump 1.6s steps(2) infinite}
@keyframes grump{50%{transform:translateX(-3px) rotate(-4deg)}}
.typelabel{position:absolute;left:0;bottom:2px;font-size:.6rem;background:rgba(255,255,255,.7);border-radius:4px;padding:0 5px;max-width:48%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@keyframes hop{50%{transform:translateY(-6px)}}
@keyframes wobble{25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}
@keyframes breathe{50%{transform:scaleY(.95) translateY(2px)}}
@keyframes jump{50%{transform:translateY(-16px)}}
.bubble{position:absolute;top:4px;left:50%;transform:translateX(-50%);max-width:94%;background:#fff;border:2px solid var(--lcd-ink);border-radius:8px;
  padding:1px 8px;font-size:.7rem;line-height:1.45;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.zzz{position:absolute;right:22%;top:38px;font-size:.8rem;animation:zz 2s steps(3) infinite}
@keyframes zz{0%{opacity:0;transform:translateY(6px)}50%{opacity:1}100%{opacity:0;transform:translateY(-8px)}}
.spark{position:absolute;width:10px;height:10px;animation:tw 1.2s steps(2) infinite}
@keyframes tw{50%{opacity:.15}}
.confetti{position:absolute;width:7px;height:7px;border-radius:2px;pointer-events:none;animation:conf 1.2s ease-out forwards}
@keyframes conf{0%{opacity:0;transform:translateY(10px) rotate(0)}20%{opacity:1}100%{opacity:0;transform:translateY(-40px) rotate(200deg)}}
.pop{position:absolute;bottom:70px;left:50%;width:16px;height:14px;pointer-events:none;animation:pop .9s ease-out forwards}
.pop.xp{width:auto;height:auto;font-size:.72rem;white-space:nowrap}
@keyframes pop{0%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,-48px)}}
.meters{display:grid;grid-template-columns:1fr 1fr;gap:0 10px;margin-top:4px;font-size:.66rem;line-height:1.55}
.meter{display:flex;justify-content:space-between;gap:4px;min-width:0}
.meter span:first-child{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.meter span:last-child{flex:none}
.xp{display:flex;align-items:center;gap:6px;margin-top:5px;font-size:.66rem}
.xpbar{flex:1;height:8px;border:2px solid var(--lcd-ink);border-radius:2px;padding:1px}
.xpbar i{display:block;height:100%;background:var(--lcd-ink);width:0;transition:width .4s steps(6)}
.dev-btns{display:flex;justify-content:center;gap:18px;margin-top:12px}
.dev-btns button{border:none;background:none;padding:0;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;font-size:.68rem;color:#8E4565;font-weight:700}
.dev-btns .knob{width:38px;height:38px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FFF6D8,#F3C55A 70%);box-shadow:0 4px 0 #C99A33,inset 0 -2px 0 rgba(0,0,0,.08)}
.dev-btns button[aria-pressed="true"] .knob{transform:translateY(3px);box-shadow:0 1px 0 #C99A33}
.gear{display:block;margin:10px auto 16px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 16px;font-size:.8rem;color:var(--sub);cursor:pointer}

/* ===== カード共通 ===== */
.card{background:var(--card);border-radius:18px;padding:14px;margin-bottom:12px;box-shadow:0 2px 0 var(--line)}
.card h3{margin:0 0 8px;font-size:.95rem}
.hint{font-size:.78rem;color:var(--sub);margin:0 0 10px}
.datenav{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.datenav div{text-align:center;line-height:1.25}
.datenav b{font-size:1rem}.datenav small{display:block;color:var(--sub);font-size:.72rem}
.navbtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-size:1.1rem;cursor:pointer}
.navbtn:disabled{opacity:.3;cursor:default}

/* きょうの合計 */
.total{text-align:center}
.total .big{font-family:var(--pixel);font-size:2.3rem;line-height:1.1}
.total .goal{font-size:.82rem;color:var(--sub)}
.goalbar{height:14px;border-radius:999px;background:var(--line);overflow:hidden;margin:10px 0 6px}
.goalbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#F7C960,#F59BB0);border-radius:999px;transition:width .5s}
.gsum{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 12px;font-size:.78rem;color:var(--sub)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px;vertical-align:0}

/* タイマー */
.items{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.item{display:flex;align-items:center;gap:8px;text-align:left;border:2px solid transparent;background:var(--bg);border-radius:12px;padding:9px 10px;font-size:.88rem;cursor:pointer;min-height:44px;line-height:1.3}
.item .box{flex:none;width:18px;height:18px;border:2px solid var(--g);border-radius:4px;display:grid;place-items:center}
.item.on{border-color:var(--g)}
.item.on .box{background:var(--g)}
.item.on .box::after{content:"";width:5px;height:9px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.chips-g{margin-bottom:8px}
.chips-g small{display:block;font-size:.74rem;color:var(--sub);margin-bottom:3px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:2px solid color-mix(in srgb,var(--g) 55%,transparent);background:color-mix(in srgb,var(--g) 12%,var(--card));border-radius:999px;padding:7px 13px;font-size:.88rem;cursor:pointer;min-height:40px}
.chip[aria-pressed="true"]{background:var(--g);border-color:var(--g);color:#fff;font-weight:700}
.clock{font-family:var(--pixel);font-size:2.6rem;text-align:center;line-height:1.1;margin:6px 0 2px;font-variant-numeric:tabular-nums}
.running-name{text-align:center;font-weight:700}
.bigbtn{display:block;width:100%;border:none;border-radius:999px;padding:14px;font-size:1.05rem;font-weight:900;cursor:pointer;margin-top:10px;
  background:linear-gradient(135deg,#F7C960,#E8A93C);color:#4A3214;box-shadow:0 4px 0 #C98F2C}
.bigbtn.stop{background:linear-gradient(135deg,#F7A8BC,#E8829E);color:#fff;box-shadow:0 4px 0 #C4627E}
.bigbtn:disabled{opacity:.45;cursor:default}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:8px 0}
.quick button{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 0;font-size:.88rem;cursor:pointer}

/* 記録リスト */
.loglist{list-style:none;margin:0;padding:0}
.loglist li{border-top:1px solid var(--line);padding:9px 0;font-size:.88rem}
.loglist li:first-child{border-top:none}
.loglist .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.loglist .meta{color:var(--sub);font-size:.74rem}
.loglist .memo{margin-top:3px;white-space:pre-wrap;word-break:break-word;font-size:.84rem;background:var(--bg);border-radius:8px;padding:5px 8px}

/* ===== ドラクエ窓 ===== */
.dq{background:var(--dq);color:#fff;border:3px solid #fff;border-radius:8px;box-shadow:0 0 0 3px var(--dq);font-family:var(--pixel);padding:12px 14px;margin:3px 3px 14px;line-height:1.7}
.dq h3{margin:0 0 6px;font-size:.95rem;font-weight:400;color:#FFE08A}
.dq p{margin:0 0 8px;font-size:.9rem}
.dq .small{font-size:.74rem;color:#CFC8DA}
.cmd{display:block;width:100%;text-align:left;background:none;border:none;color:#fff;font-family:var(--pixel);font-size:.95rem;padding:8px 6px 8px 26px;cursor:pointer;position:relative;border-radius:4px;line-height:1.45}
.cmd::before{content:"";position:absolute;left:8px;top:50%;margin-top:-6px;border:6px solid transparent;border-left:9px solid #fff;opacity:0}
.cmd:hover::before,.cmd:focus-visible::before{opacity:1}
.cmd:focus-visible{outline:none;background:rgba(255,255,255,.08)}
.cmd.done{color:#8E879A;text-decoration:line-through}
.cmd.done::after{content:"CLEAR";position:absolute;right:6px;top:9px;font-size:.66rem;color:#FFE08A;text-decoration:none}
.bossbtn{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:none;cursor:pointer;background:linear-gradient(135deg,#3B2A55,#6B4B8F);color:#fff;border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 4px 0 #2B1E40}
.bossbtn svg{width:56px;height:56px;flex:none}
.bossbtn b{display:block;font-size:1rem}.bossbtn small{font-size:.76rem;opacity:.85}

/* ===== ふりかえり ===== */
.bars{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end;height:140px;margin:6px 0 4px}
.bar{display:flex;flex-direction:column-reverse;align-items:stretch;height:100%;justify-content:flex-start}
.bar .stack{display:flex;flex-direction:column-reverse;border-radius:6px 6px 2px 2px;overflow:hidden;background:var(--line);min-height:3px}
.bar .stack i{display:block}
.bar .v{text-align:center;font-family:var(--pixel);font-size:.62rem;color:var(--sub);margin-bottom:2px;white-space:nowrap}
.barlbl{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center;font-size:.72rem;color:var(--sub)}
.barlbl .today{color:var(--ink);font-weight:900}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:.74rem;color:var(--sub);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--bg);border-radius:12px;padding:8px;text-align:center}
.stat b{display:block;font-size:1.05rem;font-family:var(--pixel);font-weight:400}
.stat small{font-size:.7rem;color:var(--sub)}

/* ===== 設定 ===== */
label.f{display:block;font-size:.8rem;color:var(--sub);margin:0 0 4px}
.in{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:9px 10px;font-family:inherit;font-size:1rem}
textarea.in{min-height:70px;font-size:.9rem;resize:vertical}
.row{display:flex;gap:6px;align-items:center;margin-bottom:6px}
.row .in{flex:1;min-width:0}
.btn{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:9px 16px;font-size:.88rem;cursor:pointer;font-weight:700}
.btn.primary{border:none;background:linear-gradient(135deg,#F7C960,#E8A93C);color:#4A3214;box-shadow:0 3px 0 #C98F2C}
.btn.sm{padding:6px 12px;font-size:.78rem}
.btn.del{color:var(--sub);font-weight:500}
.btn.armed{background:#E4877F;color:#fff;border-color:#E4877F}
.swatches{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 8px}
.sw{width:28px;height:28px;border-radius:50%;border:3px solid transparent;cursor:pointer;padding:0}
.sw[aria-pressed="true"]{border-color:var(--ink)}
.gedit{border:2px solid color-mix(in srgb,var(--g) 50%,transparent);border-radius:14px;padding:10px;margin-bottom:10px}
.btnrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.banner{background:linear-gradient(135deg,#FFF0C9,#FFE0EA);border-radius:18px;padding:14px;margin-bottom:12px}
.banner b{display:block;margin-bottom:4px}
.card.toi{background:linear-gradient(135deg,#FFF7E0,#FFF0F4);border:2px solid #F3DCA0}
.toihead{display:flex;justify-content:space-between;font-size:.78rem;color:var(--sub);margin-bottom:4px}
.toinum{font-family:var(--pixel)}
.toiq{margin:0 0 6px;font-size:1.05rem;font-weight:700;line-height:1.6}
.toih{margin:0 0 10px;font-size:.82rem;color:var(--sub);background:rgba(255,255,255,.55);border-radius:8px;padding:5px 9px}
.toimark[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:#4A3214}
.note{font-size:.74rem;color:var(--sub);text-align:center;margin:18px 4px 0;line-height:1.7}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--dq);color:#fff;font-family:var(--pixel);font-size:.85rem;padding:8px 16px;border:2px solid #fff;border-radius:8px;z-index:60;max-width:90vw;text-align:center}

/* ===== モーダル ===== */
.modal{position:fixed;inset:0;background:rgba(40,30,50,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal .box{background:var(--card);border-radius:20px;padding:18px;width:min(100%,420px);max-height:88vh;overflow:auto}
.modal h2{margin:0 0 8px;font-size:1.05rem}
.modal .acts{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;margin-top:14px}
.evo svg{width:120px;height:120px;display:block;margin:0 auto 6px}

/* ===== ボス戦 ===== */
.battle{position:fixed;inset:0;background:#000;color:#fff;z-index:40;display:flex;flex-direction:column;font-family:var(--pixel);
  padding:calc(12px + env(safe-area-inset-top,0px)) 12px calc(12px + env(safe-area-inset-bottom,0px))}
.battle .inner{max-width:470px;width:100%;margin:0 auto;display:flex;flex-direction:column;height:100%}
.bstatus{display:flex;justify-content:space-between;gap:10px}
.bstatus .dq{flex:1;margin:3px;padding:6px 10px;font-size:.82rem;line-height:1.5}
.field{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:150px;position:relative}
.monster{width:150px;height:150px;transition:transform .3s,opacity .6s,filter .3s}
.monster svg{width:100%;height:100%}
.monster.shake{animation:shake .35s steps(4)}
.monster.flash{filter:brightness(3)}
.monster.gone{opacity:0;transform:scale(.2) translateY(-30px)}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.mname{margin-top:8px;font-size:.9rem}
.hpbar{width:150px;height:8px;border:2px solid #fff;border-radius:2px;padding:1px;margin-top:4px}
.hpbar i{display:block;height:100%;background:#7FE08A;transition:width .5s steps(8)}
.dmg{position:absolute;top:30%;font-size:1.4rem;color:#FFE08A;animation:pop .9s ease-out forwards;left:50%}
.lightball{position:absolute;width:14px;height:14px;background:#FFE08A;border-radius:50%;box-shadow:0 0 18px 8px rgba(255,224,138,.6);animation:rise 1.6s ease-out forwards}
@keyframes rise{0%{opacity:0;transform:translateY(20px)}30%{opacity:1}100%{opacity:0;transform:translateY(-90px)}}
.msg{min-height:84px;font-size:.95rem;white-space:pre-wrap}
.cmds.grid{display:grid;grid-template-columns:1fr 1fr}
.breath{width:70px;height:70px;border-radius:50%;border:3px solid #FFE08A;margin:4px auto 8px;animation:breath 8s ease-in-out infinite}
@keyframes breath{0%,100%{transform:scale(.6)}50%{transform:scale(1)}}
.bin{width:100%;background:#000;color:#fff;border:2px solid #fff;border-radius:6px;padding:8px;font-family:var(--pixel);font-size:.95rem;min-height:70px;resize:vertical}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}
}
</style>
</head>
<body>
<main>
  <div class="device">
    <div class="dev-title" id="devTitle">エゴ育成ゲーム</div>
    <div class="lcd-frame">
      <div class="lcd" id="lcd">
        <div class="lcd-top"><span id="lvl"></span><span id="lcdToday"></span></div>
        <div class="stage-area" id="stageArea">
          <div class="bubble" id="bubble"></div>
          <div class="pet" id="pet" role="img"></div>
          <div class="typelabel" id="typeLabel"></div>
        </div>
        <div class="meters" id="meters"></div>
        <div class="xp"><div class="xpbar"><i id="xpfill"></i></div><span id="xptext"></span></div>
      </div>
    </div>
    <div class="dev-btns">
      <button data-tab="today" aria-pressed="true"><span class="knob"></span>そだてる</button>
      <button data-tab="review" aria-pressed="false"><span class="knob"></span>ふりかえり</button>
      <button data-tab="quest" aria-pressed="false"><span class="knob"></span>イヤな日</button>
    </div>
  </div>
  <button class="gear" data-tab="settings">せってい（育成メニュー・目標・引っ越し）</button>

  <section id="tab-today"></section>
  <section id="tab-review" hidden></section>
  <section id="tab-quest" hidden></section>
  <section id="tab-settings" hidden></section>

  <p class="note">記録はこの端末（ブラウザ）の中だけに保存されます。<br>医療・カウンセリングの代わりではなく、自分磨きを楽しく続けるための記録ゲームです。<br>🕯️の問いは すこし深め。つらければ とばしてOK。深い傷は 専門家と いっしょに。</p>
</main>

<div class="modal" id="modal" hidden role="dialog" aria-modal="true" aria-labelledby="mTitle">
  <div class="box"><h2 id="mTitle"></h2><div id="mBody"></div><div class="acts" id="mActs"></div></div>
</div>

<div class="battle" id="battle" hidden>
  <div class="inner">
    <div class="bstatus">
      <div class="dq" id="bMe"></div>
      <div class="dq" style="flex:none"><button class="cmd" id="bRun" style="padding:2px 6px 2px 22px;font-size:.82rem">にげる</button></div>
    </div>
    <div class="field" id="field">
      <div class="monster" id="monster"></div>
      <div class="mname" id="mname"></div>
      <div class="hpbar" id="mhp"><i></i></div>
    </div>
    <div class="dq" style="margin-bottom:3px">
      <div class="msg" id="msg" aria-live="polite"></div>

function normalize(o){

  return d;
}

function bestStreak(){

function seeded(seed){ return ()=>{ seed|=0; seed=seed+0x6D2B79F5|0; let t=Math.imul(seed^seed>>>15,1|seed); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function questsFor(k){
  const pool=D.questPool.slice(); if(!pool.length) return [];
  let h=0; for(const ch of k) h=Math.imul(h^ch.charCodeAt(0),16777619);
  const rnd=seeded(h), out=[];
  while(out.length<Math.min(CONFIG.questsPerDay,pool.length)) out.push(pool.splice(Math.floor(rnd()*pool.length),1)[0]);
  return out;
}

// ---------- キャラのタイプ（向き合い方から決まる・名前と見た目は kotoba.js の types） ----------
function features(){
  const days=14, keys=[...Array(days)].map((_,i)=>dk(addDays(new Date(),-i)));
  const logs=D.logs.filter(l=>keys.includes(dk(new Date(l.at))));
  const activeDays=keys.filter(anyOn);
  const mins=keys.map(dayMin);
  const active=activeDays.length, total=mins.reduce((a,b)=>a+b,0);
  const avgMin=active?total/active:0;
  const goalHit=active?keys.filter(kk=>dayMin(kk)>=D.goal).length/active:0;
  const byG={}; logs.forEach(l=>{ byG[l.g]=(byG[l.g]||0)+l.min; });
  const gs=D.genres.filter(g=>g.items.length);
  const shares=gs.map(g=>total?(byG[g.id]||0)/total:0);
  const topI=shares.indexOf(Math.max(0,...shares));
  const topShare=shares.length?Math.max(0,...shares):0, topName=gs[topI]?gs[topI].name:'';
  const balance=shares.length>=3&&total?Math.min(...shares):0;
  const memoRate=logs.length?logs.filter(l=>l.memo).length/logs.length:0;
  const toiRate=active?keys.filter(kk=>D.toi[kk]&&D.toi[kk].text).length/active:0;
  const marks=keys.filter(kk=>D.toi[kk]&&D.toi[kk].mark).length;
  const boss=D.battles.filter(b=>keys.includes(dk(new Date(b.at)))).length;
  const hrs=logs.map(l=>new Date(l.at).getHours());
  const morning=logs.length?hrs.filter(h=>h<10).length/logs.length:0;
  const night=logs.length?hrs.filter(h=>h>=21).length/logs.length:0;
  const wk=logs.length?logs.filter(l=>[0,6].includes(new Date(l.at).getDay())).length/logs.length:0;
  const sessionAvg=logs.length?total/logs.length:0;
  const quests=active?keys.filter(kk=>dayQuests(kk)>0).length/active:0;
  let streak=0,cur=0; keys.slice().reverse().forEach(kk=>{ cur=anyOn(kk)?cur+1:0; streak=Math.max(streak,cur); });
  const mean=total/days, cv=mean?Math.sqrt(mins.reduce((a,v)=>a+(v-mean)**2,0)/days)/mean:0;
  const weeklyPicks=Object.keys(D.weekly).filter(w=>D.weekly[w].pick).length;
  const allActive=new Set([...D.logs.map(l=>dk(new Date(l.at))),...Object.keys(D.quests),...Object.keys(D.toi)]).size;
  const sinceStart=Math.round((parseK(todayK())-parseK(D.start))/864e5);
  const idle=idleDays();
  const recent2=anyOn(todayK())||anyOn(dk(addDays(new Date(),-1)));
  const gapBefore=(()=>{ let n=0; for(let i=2;i<14;i++){ if(anyOn(keys[i])) break; n++; } return n; })();
  return {active,ratio:active/days,avgMin,goalHit,topShare,topName,balance,memoRate,toiRate,marks,boss,morning,night,wk,sessionAvg,quests,streak,cv,weeklyPicks,allActive,sinceStart,idle,recent2,gapBefore,logs:logs.length};
}
const TYPE_RULES = {
  orusuban:  f=>f.idle>=3,
  hajimemashite: f=>f.active<3 && f.allActive<5,
  haru:      f=>f.sinceStart<7 && f.active>=3,
  fukkatsu:  f=>f.recent2 && f.gapBefore>=3,
  veteran:   f=>f.allActive>=60,
  majime:    f=>f.ratio>=0.85 && f.goalHit>=0.6,
  nagatsuzuki: f=>f.streak>=10,
  yarikiri:  f=>f.goalHit>=0.9 && f.active>=5,
  tankyu:    f=>f.toiRate>=0.8 && f.active>=5,
  senshi:    f=>f.boss>=3,
  dokidoki:  f=>f.marks>=3,
  kakikaki:  f=>f.memoRate>=0.6 && f.logs>=5,
  kanjiru:   f=>f.toiRate>=0.5 && f.memoRate<0.2 && f.active>=5,
  selfhug:   f=>f.quests>=0.7 && f.active>=5,
  mitsumeru: f=>f.boss>=1 && f.memoRate>=0.4,
  keikaku:   f=>f.weeklyPicks>=2,
  asa:       f=>f.morning>=0.6 && f.logs>=5,
  yofukashi: f=>f.night>=0.6 && f.logs>=5,
  shumatsu:  f=>f.wk>=0.6 && f.logs>=5,
  heijitsu:  f=>f.wk<=0.1 && f.active>=6,
  dokan:     f=>f.sessionAvg>=90,
  chokotto:  f=>f.sessionAvg<15 && f.logs>=8,
  kotsukotsu:f=>f.ratio>=0.7 && f.avgMin<45,
  hitosuji:  f=>f.topShare>=0.75 && f.logs>=5,
  balance:   f=>f.balance>=0.25,
  merihari:  f=>f.active>=3 && f.active<=6 && f.avgMin>=60,
  kimagure:  f=>f.cv>=1.0 && f.ratio>=0.3 && f.ratio<=0.7,
  nonbiri:   f=>f.ratio>=0.3 && f.ratio<=0.6 && f.avgMin<30,
  marathon:  f=>f.ratio>=0.7,
  jibunrashisa: f=>true
};
let typeCache=null, typeCacheKey='';
function currentType(){
  const types=Array.isArray(W.types)?W.types:[]; if(!types.length) return null;
  const key=todayK()+'|'+D.logs.length+'|'+Object.keys(D.toi).length+'|'+D.battles.length+'|'+Object.keys(D.quests).length;
  if(typeCache && typeCacheKey===key) return typeCache;
  const f=features();
  let t=types.find(x=>TYPE_RULES[x.id] && TYPE_RULES[x.id](f)) || types[types.length-1];
  t=Object.assign({}, t); t.desc=(t.desc||'').replace('{genre}', f.topName||'それ'); t.f=f;
  typeCache=t; typeCacheKey=key; return t;
}

let toastT;
function toast(t){ const e=$('#toast'); e.textContent=t; e.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>e.hidden=true,2400); }
function modal(title, body, acts){
  $('#mTitle').textContent=title;
  const b=$('#mBody'); b.innerHTML=''; if(typeof body==='string') b.innerHTML=body; else if(body) b.append(body);
  const a=$('#mActs'); a.innerHTML='';
  acts.forEach(x=>{ const btn=document.createElement('button'); btn.className='btn'+(x.primary?' primary':''); btn.textContent=x.label;
    btn.onclick=()=>{ if(x.fn && x.fn()===false) return; $('#modal').hidden=true; }; a.append(btn); });
  $('#modal').hidden=false; const f=b.querySelector('input,textarea')||a.lastChild; if(f) f.focus({preventScroll:true});
}
function twoTap(btn, label, armedLabel, fn){
  let armed=false,t; btn.textContent=label;
  btn.onclick=()=>{ if(!armed){ armed=true; btn.textContent=armedLabel; btn.classList.add('armed');
      t=setTimeout(()=>{ armed=false; btn.textContent=label; btn.classList.remove('armed'); },3000); return; }
    clearTimeout(t); fn(); };
}
function el(tag, attrs, ...kids){
  const e=document.createElement(tag);
  for(const k in (attrs||{})){ const v=attrs[k]; if(k==='class') e.className=v; else if(k==='style') e.style.cssText=v; else if(k.startsWith('on')) e[k]=v; else if(v!==false && v!=null) e.setAttribute(k,v); }
  kids.flat().forEach(c=>{ if(c!=null && c!==false) e.append(c); });
  return e;
}

// ---------- 経験値の変化を受けて ----------
let lastLevel = levelOf(totalXP());
function afterChange(gain){
  save();
  const xp=totalXP(), lv=levelOf(xp), si=stageOf(xp);
  if(gain>0) popXP(gain);
  renderLCD();
  if(si>D.seen){
    D.seen=si; save(); setTimeout(()=>beep('big'),400);
    setTimeout(()=>modal('おや…？', `<div class="evo">${petSVG(si,'happy')}</div><p style="text-align:center;margin:0">${esc(D.pet)}の ようすが…！<br><b>「${STAGES[si].name}」に そだった！</b></p>`,[{label:'やったね',primary:true}]), 500);
  } else if(lv>lastLevel){ toast('レベルが あがった！ Lv.'+lv); }
  lastLevel=lv;
}
// ごほうびの音（ファイル不要。せっていでOFFにできる）
let audioCtx=null;
function beep(kind){
  if(!D.sound) return;
  try{
    audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state==='suspended') audioCtx.resume();
    const notes = kind==='big' ? [[523,0],[659,.09],[784,.18],[1047,.3]] : kind==='tiny' ? [[880,0]] : [[659,0],[880,.1]];
    notes.forEach(([f,t])=>{
      const o=audioCtx.createOscillator(), g=audioCtx.createGain();
      o.type='square'; o.frequency.value=f;
      const at=audioCtx.currentTime+t;
      g.gain.setValueAtTime(0.0001,at); g.gain.exponentialRampToValueAtTime(0.08,at+0.01); g.gain.exponentialRampToValueAtTime(0.0001,at+(kind==='big'?0.28:0.16));
      o.connect(g); g.connect(audioCtx.destination); o.start(at); o.stop(at+0.3);
    });
  }catch(e){}
}
// ごほうびの演出（記録した瞬間）
function celebrate(big){
  const area=$('#stageArea'), pet=$('#pet');
  const si=stageOf(totalXP());
  pet.innerHTML=petSVG(si,'happy');
  pet.classList.remove('jump'); void pet.offsetWidth; pet.classList.add('jump');
  for(let i=0;i<(big?10:6);i++){
    const sp=el('div',{class:'confetti',style:`left:${10+Math.random()*80}%;top:${10+Math.random()*50}%;background:${['#F59BB0','#F7C960','#86B7E6','#7CCAA2','#B59AE6'][i%5]};animation-delay:${(i*0.06).toFixed(2)}s`});
    area.append(sp); setTimeout(()=>sp.remove(),1300);
  }
  const set=LINES.reward; $('#bubble').textContent=set[Math.floor(Math.random()*set.length)];
  beep(big?'big':'small');
  setTimeout(()=>{ pet.classList.remove('jump'); renderLCD(); },1400);
}
function popXP(n){
  const area=$('#stageArea');

function speak(force){
  const si=stageOf(totalXP()), m=mood(), set=si===0&&m!=='work'?LINES.egg:(m==='grumpy'&&idleDays()>=3?LINES.grumpy2:LINES[m]);

function renderLCD(){
  const xp=totalXP(), si=stageOf(xp), st=STAGES[si], m=mood(), k=todayK();

  $('#lvl').textContent='Lv.'+levelOf(xp)+' '+st.name;

  const tp=currentType(); $('#typeLabel').textContent=tp?tp.name:''; if(tp && !(D.typesSeen||[]).includes(tp.id)){ D.typesSeen=(D.typesSeen||[]).concat(tp.id); save(); }

}

// ---------- 記録の追加 ----------
function addLog(at, min, g, item, memo){
  min=Math.min(MAX_MIN,Math.round(min)); if(!(min>0)) return;
  const before=dayMin(todayK());
  D.logs.push({id:uid(), at, min, g:g.id, i:item.id, n:item.name, memo:str(memo,300)});
  afterChange(min);
  const nowMin=dayMin(todayK());
  celebrate(before<D.goal && nowMin>=D.goal);
  if(before<D.goal && nowMin>=D.goal) setTimeout(()=>toast('きょうの もくひょう たっせい！'),300);
}

// ---------- おしらせ（通知）----------
// スマホの通知は https の置き場所＋ホーム画面に追加したときに動く。ページが閉じている間は
// 端末側の制約で時刻ぴったりは保証できないので、開いたときにも必ず出す（取りこぼし防止）。
const canNotify = () => 'Notification' in window && 'serviceWorker' in navigator && /^https?:$/.test(location.protocol);
async function swReg(){ try{ return await navigator.serviceWorker.ready; }catch(e){ return null; } }
function notifyState(){ return !canNotify() ? 'unsupported' : Notification.permission; }
async function askNotify(){
  if(!canNotify()) return 'unsupported';
  try{ return await Notification.requestPermission(); }catch(e){ return 'denied'; }
}
async function showNote(title, body, tag, extra){
  const reg=await swReg(); if(!reg || Notification.permission!=='granted') return false;
  try{ await reg.showNotification(title, Object.assign({body, tag, icon:'icon-192.png', badge:'icon-192.png', lang:'ja', renotify:false}, extra||{})); return true; }catch(e){ return false; }
}
async function closeNote(tag){ const reg=await swReg(); if(!reg) return; try{ (await reg.getNotifications({tag})).forEach(n=>n.close()); }catch(e){} }
// タイマー中の通知（#3）
async function timerNotify(){
  if(!D.running){ closeNote('timer'); return; }
  const d=new Date(D.running.at), m=Math.floor((Date.now()-D.running.at)/60000);
  await showNote(D.running.n+' を そだて中', (m?m+'分 ':'')+'（'+pad(d.getHours())+':'+pad(d.getMinutes())+'〜）タップして ストップ', 'timer', {silent:true, requireInteraction:true, data:{open:'today'}});
}
setInterval(()=>{ if(D.running && canNotify() && Notification.permission==='granted') timerNotify(); }, 60000);
// 毎日のおしらせ（#2）：設定時刻を過ぎていて、きょうまだ出していなければ出す
let remindT=null;
function todayToi(){ const t=toiOf(todayK()); return t?t.q:''; }
async function fireRemind(){
  const n=D.notify; if(!n.on || !canNotify() || Notification.permission!=='granted') return;
  if(n.last===todayK()) return;
  const [h,mi]=n.time.split(':').map(Number); const now=new Date();
  if(now.getHours()*60+now.getMinutes() < h*60+mi) return;
  const q=todayToi(), m=dayMin(todayK());
  const ok=await showNote('きょうの問い', q+(m?'\n（きょう '+fmtMin(m)+' そだてた）':''), 'daily', {data:{open:'today'}});
  if(ok){ n.last=todayK(); save(); }
  syncRemindCfg();
}
async function syncRemindCfg(){
  try{ const reg=await swReg(); const n=D.notify; if(reg&&reg.active) reg.active.postMessage({type:'remind-config', on:n.on, time:n.time, last:n.last, q:todayToi()});
    if(reg && n.on && 'periodicSync' in reg){ try{ await reg.periodicSync.register('daily-remind',{minInterval:6*3600*1000}); }catch(e){} } }catch(e){}
}
function scheduleRemind(){
  clearTimeout(remindT);
  const n=D.notify; if(!n.on){ syncRemindCfg(); return; }
  const [h,mi]=n.time.split(':').map(Number); const t=new Date(); t.setHours(h,mi,0,0);
  if(t<=Date.now()) t.setDate(t.getDate()+1);
  remindT=setTimeout(()=>{ fireRemind(); scheduleRemind(); }, Math.min(t-Date.now(), 2147000000));
  fireRemind();
}
document.addEventListener('visibilitychange',()=>{ if(!document.hidden){ fireRemind(); if(D.running) timerNotify(); } });

let B=null, typing=null;
function say(text){
  return new Promise(res=>{
    const m=$('#msg'); m.textContent=''; let i=0;
    clearInterval(typing);
    const finish=()=>{ clearInterval(typing); typing=null; m.textContent=text; m.onclick=null; res(); };
    if(matchMedia('(prefers-reduced-motion: reduce)').matches) return finish();
    typing=setInterval(()=>{ i++; m.textContent=text.slice(0,i); if(i>=text.length) finish(); },28);
    m.onclick=finish;
  });
}
function cmds(list, grid, pre){
  const c=$('#cmds'); c.innerHTML=''; c.className='cmds'+(grid?' grid':'');
  if(pre) c.append(pre);
  return new Promise(res=>{
    list.forEach(x=>c.append(el('button',{class:'cmd',onclick:()=>{ c.innerHTML=''; res(x); }},typeof x==='string'?x:x.label)));
    const f=c.querySelector('button'); if(f) f.focus({preventScroll:true});
  });
}
function meBox(){ $('#bMe').innerHTML=`わたし Lv.${levelOf(totalXP())}<br>HP ${B.hp}/${B.maxHp}`; }
function monHP(){ $('#mhp i').style.width=Math.max(0,B.mhp)+'%'; }
async function startBattle(){
  B={hp:6,maxHp:30,mhp:100,ans:[],memo:'',feel:'',mon:'',fled:false};
  $('#battle').hidden=false; document.body.style.overflow='hidden';
  $('#monster').className='monster'; $('#monster').innerHTML=''; $('#mname').textContent=''; $('#mhp').hidden=true;
  meBox();
  $('#bRun').onclick=flee; $('#bRun').hidden=false;
  await say('つらすぎる ときは 右上の「にげる」で いつでも おわれます。\nふかい きずは ひとりで たたかわず、専門家や しんらいできる人と。');
  await cmds(['わかった']);
  if(B.fled) return;
  await say('なにが あった？\n（かかなくても OK。この端末だけに のこります）');
  const ta=el('textarea',{class:'bin',maxlength:'400','aria-label':'なにがあったか'});
  const go=el('button',{class:'cmd'},'すすむ');
  $('#cmds').innerHTML=''; $('#cmds').className='cmds'; $('#cmds').append(ta,go);
  await new Promise(r=>go.onclick=r);
  if(B.fled) return;
  $('#cmds').innerHTML='';
  B.memo=ta.value.trim().slice(0,400);
  await say('いまの きもちに いちばん ちかいのは？');
  const f=await cmds(CONFIG.feelings.map(x=>({label:x.label,v:x})),true);
  if(B.fled) return;
  B.feel=f.v.label; B.mon=f.v.mon;
  $('#monster').innerHTML=monSVG(f.v.color); $('#mname').textContent=B.mon; $('#mhp').hidden=false; monHP();
  await say(B.mon+' が あらわれた！');
  await cmds(['▼']);
  if(B.fled) return;
  await say('わたしは すこし きずついている。\nまずは ホイミで じぶんを まもろう。');
  await cmds(['ホイミ（しんこきゅう）']);
  if(B.fled) return;
  for(let i=1;i<=3;i++){
    const ring=el('div',{class:'breath'});
    $('#cmds').innerHTML=''; $('#cmds').append(ring);
    await say(`すって… はいて…（${i}/3）\nわっかに あわせて ゆっくり`);
    await cmds([i<3?'すった・はいた':'さいごの ひと呼吸'], false, ring);
    if(B.fled) return;
    B.hp=Math.min(B.maxHp,B.hp+8); meBox();
  }
  B.hp=B.maxHp; meBox();
  await say('HPが かいふくした！\nさあ、たたかおう。');
  const steps=CONFIG.bossSteps;
  for(let si=0; si<steps.length; si++){
    const st=steps[si];
    await cmds(['たたかう']);
    if(B.fled) return;
    await say(st.q);
    const a=await cmds(st.choices);
    if(B.fled) return;
    B.ans.push(a);
    const last=si===steps.length-1, crit=a==='いま';
    const dmg=last? B.mhp : Math.min(B.mhp-5, Math.round(100/steps.length*(crit?1.4:1)));
    B.mhp-=dmg;
    const m=$('#monster'); m.classList.add('flash','shake'); setTimeout(()=>m.classList.remove('flash','shake'),400);
    const dn=el('div',{class:'dmg'},String(dmg)); $('#field').append(dn); setTimeout(()=>dn.remove(),950);
    monHP();
    const reply=CONFIG.bossReplies[a];
    await say((reply?reply+'\n':'「'+a+'」を えらんだ！\n')+B.mon+'に '+dmg+'の ダメージ！');
  }
  $('#bRun').hidden=true;
  $('#monster').classList.add('gone');
  for(let i=0;i<5;i++){ const b=el('div',{class:'lightball',style:`left:${30+i*10}%;top:45%;animation-delay:${i*.15}s`}); $('#field').append(b); setTimeout(()=>b.remove(),2400); }
  await say(B.mon+'は ひかりの つぶに なった！');
  await cmds(['▼']);
  D.battles.push({at:Date.now(), mon:B.mon, feel:B.feel, memo:B.memo, ans:B.ans}); save();
  const before=levelOf(totalXP()-CONFIG.xp.boss), after=levelOf(totalXP());
  await say('けいけんち '+CONFIG.xp.boss+'ポイント かくとく！'+(after>before?'\nレベルが '+after+'に あがった！':''));
  await cmds(['▼']);
  await say('けっかは どうでも いい。\nそれでも わたしは、じぶんの ために うごけた。');
  await cmds(['▼']);
  await say('さいごに えらんだ「'+B.ans[B.ans.length-1]+'」、\nできそうなら いま やってみよう。');
  await cmds(['へやに もどる']);
  endBattle(true);
}
function flee(){
  if(!B || B.fled) return;
  B.fled=true; clearInterval(typing); $('#msg').onclick=null;
  $('#msg').textContent='うまく にげきった！\nにげるのも たいせつな せんりゃく。';
  $('#cmds').innerHTML=''; $('#cmds').className='cmds';
  const b=el('button',{class:'cmd',onclick:()=>endBattle(false)},'もどる'); $('#cmds').append(b); b.focus();
}
function endBattle(won){
  $('#battle').hidden=true; document.body.style.overflow='';
  B=null; afterChange(won?CONFIG.xp.boss:0); renderQuest();
}

// ---------- 画面：せってい ----------
function renderSettings(){
  const s=$('#tab-settings'); s.innerHTML='';
  if(!D.setup) s.append(el('div',{class:'banner'},el('b',null,'育成メニューを 決めよう'),
    el('p',{class:'hint',style:'margin:0 0 8px'},'下の「育成メニュー」で、じぶんを育てるために やりたいことを 足したり けしたり してね。ジャンル名・色も かえられます。あとから いつでも 変更OK。'),
    el('button',{class:'btn primary',onclick:()=>{ D.setup=true; save(); showTab('today'); toast('いってらっしゃい！'); }},'これで はじめる')));

  // 目標
  const c0=el('div',{class:'card'},el('h3',null,'1日の もくひょう'));
  const goal=el('select',{class:'in','aria-label':'1日の目標'});
  [15,30,45,60,90,120,180,240].concat([D.goal]).filter((v,i,a)=>a.indexOf(v)===i).sort((a,b)=>a-b).forEach(v=>goal.append(el('option',{value:String(v),selected:v===D.goal?'':false},fmtMin(v))));
  goal.onchange=()=>{ D.goal=+goal.value; save(); renderLCD(); };
  const snd=el('button',{class:'btn sm'+(D.sound?' primary':''),style:'margin-top:10px','aria-pressed':String(D.sound),onclick:()=>{ D.sound=!D.sound; save(); if(D.sound) beep('small'); renderSettings(); }},D.sound?'♪ ごほうびの音 ON':'♪ ごほうびの音 OFF');
  c0.append(goal, el('p',{class:'hint',style:'margin:8px 0 0'},'たっせいすると '+'キャラが ぴかぴかに なります。'), snd);
  s.append(c0);

  // おしらせ
  const cn=el('div',{class:'card'},el('h3',null,'まいにちの おしらせ'));
  const st=notifyState();
  if(st==='unsupported'){
    cn.append(el('p',{class:'hint',style:'margin:0'},'通知は、ネット上の置き場所（https）に置いて ホーム画面に追加すると使えます。いまの開き方では使えません。'));
  } else {
    const n=D.notify;
    const tog=el('button',{class:'btn'+(n.on?' primary':''),'aria-pressed':String(n.on)},n.on?'おしらせ ON':'おしらせ OFF');
    const time=el('input',{class:'in',type:'time',value:n.time,'aria-label':'おしらせの時刻',style:'width:auto'});
    tog.onclick=async()=>{
      if(!n.on){ const p=await askNotify(); if(p!=='granted'){ toast(p==='denied'?'スマホの設定で この サイトの通知を 許可してね':'通知が 許可されませんでした'); renderSettings(); return; } n.on=true; }
      else n.on=false;
      save(); scheduleRemind(); if(!n.on) closeNote('daily'); renderSettings();
      if(n.on) showNote('おしらせ ON', '毎日 '+n.time+' に「きょうの問い」が とどきます', 'daily-test');
    };
    time.onchange=()=>{ n.time=time.value||'21:00'; n.last=''; save(); scheduleRemind(); };
    cn.append(el('div',{class:'btnrow',style:'align-items:center'},tog,el('span',{class:'hint',style:'margin:0'},'時刻'),time),
      el('p',{class:'hint',style:'margin:10px 0 0'},'この時刻に「きょうの問い」が 通知で とどきます。タイマー中は 通知バーに「そだて中」が 出ます。'+(st==='denied'?'（いまは スマホ側で 通知が止められています）':'')));
  }
  s.append(cn);

  // 育成メニュー
  const c2=el('div',{class:'card'},el('h3',null,'育成メニュー'),el('p',{class:'hint'},'名前を変えても、これまでの記録は のこります。'));
  D.genres.forEach((g,gi)=>{
    const box=el('div',{class:'gedit',style:'--g:'+hexOf(g.color)});
    const nm=el('input',{class:'in',maxlength:'12',value:g.name,'aria-label':'ジャンル名'});
    nm.oninput=()=>{ g.name=nm.value.trim()||'ジャンル'; save(); renderLCD(); };
    const del=el('button',{class:'btn sm del'});
    twoTap(del,'ジャンルをけす','もう1回で けす',()=>{ D.genres.splice(gi,1); save(); renderAll(); });
    box.append(el('div',{class:'row'},nm,del));
    const sw=el('div',{class:'swatches'});
    PALETTE.forEach(p=>sw.append(el('button',{class:'sw',style:'background:'+p.hex,'aria-label':'色 '+p.id,'aria-pressed':String(g.color===p.id),onclick:()=>{ g.color=p.id; save(); renderAll(); }})));
    box.append(sw);
    g.items.forEach((it,ii)=>{
      const inp=el('input',{class:'in',maxlength:'20',value:it.name,'aria-label':'メニュー名'});
      inp.oninput=()=>{ it.name=inp.value.trim()||'メニュー'; save(); };
      const d=el('button',{class:'btn sm del'});
      twoTap(d,'けす','もう1回',()=>{ g.items.splice(ii,1); save(); renderAll(); });
      box.append(el('div',{class:'row'},inp,d));
    });
    if(g.items.length<MAX_ITEMS){
      const add=el('input',{class:'in',maxlength:'20',placeholder:'メニューを たす（例：ストレッチ）'});
      const addB=el('button',{class:'btn sm',onclick:()=>{ const v=add.value.trim(); if(!v) return; g.items.push({id:uid(),name:v}); save(); renderAll(); }},'たす');
      add.onkeydown=e=>{ if(e.key==='Enter') addB.click(); };
      box.append(el('div',{class:'row'},add,addB));
    }
    c2.append(box);
  });
  if(D.genres.length<MAX_GENRES) c2.append(el('button',{class:'btn',onclick:()=>{
    const used=D.genres.map(g=>g.color), c=(PALETTE.find(p=>!used.includes(p.id))||PALETTE[0]).id;
    D.genres.push({id:uid(),name:'あたらしいジャンル',color:c,items:[]}); save(); renderAll();
  }},'＋ ジャンルを ふやす'));
  s.append(c2);

  // なまえ
  const c1=el('div',{class:'card'},el('h3',null,'なまえ'));
  const pet=el('input',{class:'in',maxlength:'10',value:D.pet,'aria-label':'キャラのなまえ'});
  pet.oninput=()=>{ D.pet=pet.value.trim()||'エゴちゃん'; save(); renderLCD(); };
  const ttl=el('input',{class:'in',maxlength:'24',value:D.title,'aria-label':'ゲームのタイトル'});
  ttl.oninput=()=>{ D.title=ttl.value.trim()||'エゴ育成ゲーム'; save(); renderLCD(); };
  c1.append(el('label',{class:'f'},'キャラのなまえ'),pet,el('div',{style:'height:8px'}),el('label',{class:'f'},'ゲームのタイトル（本体の上に出ます）'),ttl);
  s.append(c1);

  // クエスト
  const c3=el('div',{class:'card'},el('h3',null,'今日のセルフハグ（リスト）'),el('p',{class:'hint'},'この中から 毎日'+CONFIG.questsPerDay+'つ、そだてる画面に 出ます。'));
  D.questPool.forEach((q,qi)=>{
    const inp=el('input',{class:'in',maxlength:'30',value:q,'aria-label':'クエスト'});
    inp.onchange=()=>{ const v=inp.value.trim(); if(v){ D.questPool[qi]=v; save(); } };
    const d=el('button',{class:'btn sm del'});
    twoTap(d,'けす','もう1回',()=>{ D.questPool.splice(qi,1); save(); renderAll(); });
    c3.append(el('div',{class:'row'},inp,d));
  });
  if(D.questPool.length<MAX_QUESTS){
    const add=el('input',{class:'in',maxlength:'30',placeholder:'クエストを たす'});
    const addB=el('button',{class:'btn sm',onclick:()=>{ const v=add.value.trim(); if(!v) return; D.questPool.push(v); save(); renderAll(); }},'たす');
    add.onkeydown=e=>{ if(e.key==='Enter') addB.click(); };
    c3.append(el('div',{class:'row'},add,addB));
  }
  s.append(c3);

  // 共有
  const c4=el('div',{class:'card'},el('h3',null,'クライエントさんに わたす'),
    el('p',{class:'hint'},'いまの 育成メニュー・もくひょう・クエストだけを 入れたリンクを作ります。記録やメモは 入りません。受けとった人は じぶんの端末で じぶん用に そだてられます（メニューも じぶんで変えられます）。'));
  const out=el('textarea',{class:'in',readonly:'',hidden:'','aria-label':'共有リンク'});
  c4.append(el('button',{class:'btn primary',onclick:async()=>{
    const url=location.href.split('#')[0]+'#setup='+b64e(JSON.stringify({t:D.title,m:D.goal,g:D.genres.map(g=>({n:g.name,c:g.color,i:g.items.map(i=>i.name)})),q:D.questPool}));
    out.value=url; out.hidden=false;
    try{ await navigator.clipboard.writeText(url); toast('リンクを コピーしました'); }catch(e){ out.select(); toast('下のリンクを コピーしてね'); }
  }},'この設定の リンクを つくる'),el('div',{style:'height:8px'}),out);
  s.append(c4);

  // 引っ越し
  const c5=el('div',{class:'card'},el('h3',null,'記録の ひっこし'),
    el('p',{class:'hint'},'スマホを かえるときは、まず「書き出す」で ファイルを保存 → 新しいスマホで「読み込む」。'));
  const dump=el('textarea',{class:'in',readonly:'',hidden:'','aria-label':'書き出したデータ'});
  const file=el('input',{type:'file',accept:'.json,application/json',hidden:''});
  const paste=el('textarea',{class:'in',hidden:'',placeholder:'書き出した文字を ここに はりつけ'});
  const pasteB=el('button',{class:'btn',hidden:'',onclick:()=>askImport(paste.value)},'これを 読み込む');
  c5.append(el('div',{class:'btnrow'},
    el('button',{class:'btn primary',onclick:()=>{
      const json=JSON.stringify({app:'ego-game',v:2,exportedAt:new Date().toISOString(),data:D});
      try{ const a=el('a',{href:URL.createObjectURL(new Blob([json],{type:'application/json'})),download:'egogame-'+todayK().replace(/-/g,'')+'.json'});
        document.body.append(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },1500); }catch(e){}
      dump.value=json; dump.hidden=false; toast('書き出しました');
    }},'書き出す'),
    el('button',{class:'btn',onclick:()=>file.click()},'ファイルから 読み込む'),
    el('button',{class:'btn',onclick:()=>{ paste.hidden=!paste.hidden; pasteB.hidden=paste.hidden; }},'文字で 読み込む')));
  c5.append(el('p',{class:'hint',style:'margin:8px 0 4px'},'ファイルが保存できないときは、書き出したあと下に出る文字を まるごとコピーして メモに保存してください。'),dump);
  file.onchange=()=>{ const f=file.files[0]; if(!f) return; const r=new FileReader(); r.onload=()=>askImport(String(r.result)); r.readAsText(f); file.value=''; };
  c5.append(file,paste,pasteB);
  s.append(c5);

  // リセット
  const c6=el('div',{class:'card'},el('h3',null,'さいしょから'),el('p',{class:'hint'},'記録を ぜんぶ けして、たまごに もどします（育成メニューは のこります）。まえに「書き出す」しておくと 安心。'));
  const rb=el('button',{class:'btn del'});
  twoTap(rb,'記録を ぜんぶ けす','もう1回で ぜんぶ けす',()=>{ const keep={title:D.title,pet:D.pet,goal:D.goal,genres:D.genres,questPool:D.questPool}; D=Object.assign(defaults(),keep,{named:true,setup:true}); save(); lastLevel=1; renderAll(); toast('あたらしい たまごが きた'); });
  c6.append(rb); s.append(c6);
}
function askImport(text){
  let d=null; try{ d=normalize(JSON.parse(text)); }catch(e){}
  if(!d){ toast('読み込めませんでした。書き出したファイルか確認してね'); return; }
  const days=new Set(d.logs.map(l=>dk(new Date(l.at)))).size;
  modal('この記録を 読み込む？', `<p>なまえ：${esc(d.pet)}<br>記録した日：${days}日／そうじかん：${fmtMin(d.logs.reduce((a,l)=>a+l.min,0))}</p><p class="hint">いま この端末にある記録は、読み込んだ記録に おきかわります。</p>`,
    [{label:'やめる'},{label:'読み込む',primary:true,fn:()=>{ D=d; D.named=true; D.setup=true; save(); lastLevel=levelOf(totalXP()); renderAll(); toast('読み込みました'); }}]);
}
function b64e(s){ const bytes=new TextEncoder().encode(s); let bin=''; bytes.forEach(b=>bin+=String.fromCharCode(b)); return btoa(bin).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); }
function b64d(s){ s=s.replace(/-/g,'+').replace(/_/g,'/'); while(s.length%4) s+='='; const bin=atob(s); return new TextDecoder().decode(Uint8Array.from(bin,c=>c.charCodeAt(0))); }

// ---------- タブ ----------
let tab='today';
function showTab(t){
  tab=t;
  ['today','quest','review','settings'].forEach(x=>$('#tab-'+x).hidden=x!==t);
  document.querySelectorAll('.dev-btns button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.tab===t)));
  renderTab();
}
function renderTab(){ ({today:renderToday,quest:renderQuest,review:renderReview,settings:renderSettings})[tab](); }
function renderAll(){ renderLCD(); renderTab(); }
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>showTab(b.dataset.tab));

let shownDay=todayK();
setInterval(()=>{
  if(todayK()!==shownDay){ if(viewDay===shownDay) viewDay=todayK(); shownDay=todayK(); renderAll(); }
  else if(D.running) renderLCD();
},60000);

// ---------- 起動 ----------
function askName(){
  const inp=el('input',{class:'in',maxlength:'10',value:D.pet,'aria-label':'なまえ'});
  const pic=el('div',{class:'evo'}); pic.innerHTML=petSVG(0,'normal');
  const box=el('div',null,pic,el('p',null,'たまごを ひろった！ なまえを つけてね。'),inp,
    el('p',{class:'hint',style:'margin-top:10px'},'じぶんを育てる時間を 記録すると、1分＝1EXP で すこしずつ そだちます。つぎに 育成メニューを 決めよう。'));
  modal('ようこそ', box, [{label:'つぎへ',primary:true,fn:()=>{ D.pet=inp.value.trim()||'エゴちゃん'; D.named=true; save(); if(!D.setup) showTab('settings'); renderLCD(); }}]);
}
renderAll();
(function boot(){
  const m=location.hash.match(/^#setup=([A-Za-z0-9_-]+)/);
  if(m){
    history.replaceState(null,'',location.pathname+location.search);
    let p=null; try{ p=JSON.parse(b64d(m[1])); }catch(e){}
    if(p && Array.isArray(p.g)){
      const list=p.g.slice(0,MAX_GENRES).map(g=>'<li>'+esc(str(g.n,12))+'：'+(Array.isArray(g.i)?g.i.slice(0,MAX_ITEMS).map(x=>esc(str(x,20))).join('、'):'')+'</li>').join('');
      modal('この設定で はじめる？', `<p>「${esc(str(p.t,24)||'エゴ育成ゲーム')}」の 育成メニュー：</p><ul style="padding-left:1.2em;font-size:.9rem">${list}</ul><p class="hint">いまの記録は のこります。メニューは あとから じぶんで 変えられます。</p>`,
        [{label:'やめる',fn:()=>{ if(!D.named) setTimeout(askName,50); }},{label:'この設定にする',primary:true,fn:()=>{
          D.title=str(p.t,24)||D.title;
          if(Number.isFinite(p.m)&&p.m>=5&&p.m<=MAX_MIN) D.goal=Math.round(p.m);
          D.genres=p.g.slice(0,MAX_GENRES).map(g=>({id:uid(),name:str(g.n,12)||'ジャンル',color:PALETTE.some(x=>x.id===g.c)?g.c:'rose',items:(Array.isArray(g.i)?g.i:[]).slice(0,MAX_ITEMS).map(n=>({id:uid(),name:str(n,20)})).filter(i=>i.name)}));
          if(Array.isArray(p.q)){ const q=p.q.map(x=>str(x,30)).filter(Boolean).slice(0,MAX_QUESTS); if(q.length) D.questPool=q; }
          D.setup=true; save(); renderAll(); if(!D.named) setTimeout(askName,50);
        }}]);
      return;
    }
  }
  if(!D.named) askName();
})();

// ---------- オフライン対応（https のサーバーに置いたときだけ動く） ----------
if('serviceWorker' in navigator && /^https?:$/.test(location.protocol)){
  window.addEventListener('load',()=>{ navigator.serviceWorker.register('sw.js').then(()=>{ scheduleRemind(); if(D.running) timerNotify(); }).catch(()=>{}); });
}
})();
</script>
