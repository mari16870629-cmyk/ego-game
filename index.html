<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>エゴ育成ゲーム</title>
<meta name="description" content="じぶんを育てる時間を、タイマーと記録で見える化。かけた時間でキャラが育つ、たまごっち風の自分磨きゲーム。">
<meta name="theme-color" content="#FFC4D6">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFF6F1; --card:#FFFFFF; --ink:#4A3F55; --sub:#8C7F96; --line:#F2E2E8;
  --shell1:#FFD6E2; --shell2:#FFB3C8; --lcd:#E6F0D6; --lcd-ink:#3F4A3A;
  --gold:#E8B84A; --dq:#101018;
  --pixel:"DotGothic16","Zen Maru Gothic",monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){ --bg:#2A2433; --card:#372F42; --ink:#F4EAF2; --sub:#BCAFC6; --line:#4A4057; }
}
:root[data-theme="dark"]{ --bg:#2A2433; --card:#372F42; --ink:#F4EAF2; --sub:#BCAFC6; --line:#4A4057; }

*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Noto Sans JP",system-ui,sans-serif;
  line-height:1.6;-webkit-font-smoothing:antialiased;
  padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
main{max-width:470px;margin:0 auto;padding:16px 16px 40px;font-size:1.02rem}
button,select{font-family:inherit;color:inherit}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
[hidden]{display:none!important}

/* ===== たまごっち本体 ===== */
.device{position:relative;width:min(100%,360px);margin:6px auto 4px;padding:17% 15% 7%;
  border-radius:50% 50% 50% 50% / 58% 58% 42% 42%;
  background:radial-gradient(rgba(255,255,255,.55) 2px,transparent 2.6px) 0 0/16px 16px,linear-gradient(165deg,var(--shell1),var(--shell2));
  box-shadow:inset -8px -12px 0 rgba(150,60,100,.10),inset 8px 10px 0 rgba(255,255,255,.55),0 12px 26px rgba(190,100,140,.28)}
.device::before{content:"";position:absolute;left:22%;top:7%;width:18%;height:6%;border-radius:50%;background:rgba(255,255,255,.6);transform:rotate(-18deg)}
.dev-title{position:absolute;left:0;right:0;top:9.5%;text-align:center;font-family:var(--pixel);font-size:.8rem;letter-spacing:.12em;color:#9C4D6E}
.lcd-frame{background:#fff;border-radius:22px;padding:7px;box-shadow:inset 0 2px 0 rgba(0,0,0,.06)}
.lcd{position:relative;background:var(--lcd);color:var(--lcd-ink);border-radius:16px;padding:8px 9px 9px;font-family:var(--pixel);overflow:hidden;
  background-image:linear-gradient(rgba(0,0,0,.035) 1px,transparent 1px);background-size:100% 3px}
.lcd-top{display:flex;justify-content:space-between;font-size:.72rem;line-height:1.3}
.stage-area{position:relative;height:124px;display:flex;align-items:flex-end;justify-content:center}
.pet{width:92px;height:92px;cursor:pointer;margin-bottom:4px}
.pet svg{width:100%;height:100%;display:block}
.pet.hop{animation:hop 1s steps(2) infinite}
.pet.work{animation:hop .5s steps(2) infinite}
.pet.wobble{animation:wobble 1.4s steps(4) infinite}
.pet.sleep{animation:breathe 2.4s steps(2) infinite}
.pet.jump{animation:jump .5s steps(3) 2}
.pet.grump{animation:grump 1.6s steps(2) infinite}
.pet.peek{animation:peek .6s steps(2) 1}
@keyframes peek{50%{transform:translateX(4px)}}
@keyframes grump{50%{transform:translateX(-3px) rotate(-4deg)}}
.typelabel{position:absolute;left:0;bottom:2px;font-size:.6rem;background:rgba(255,255,255,.7);border-radius:4px;padding:0 5px;max-width:48%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@keyframes hop{50%{transform:translateY(-6px)}}
@keyframes wobble{25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}
@keyframes breathe{50%{transform:scaleY(.95) translateY(2px)}}
@keyframes jump{50%{transform:translateY(-16px)}}
.bubble{position:absolute;top:4px;left:50%;transform:translateX(-50%);max-width:94%;background:#fff;border:2px solid var(--lcd-ink);border-radius:8px;
  padding:1px 8px;font-size:.7rem;line-height:1.45;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.zzz{position:absolute;right:22%;top:38px;font-size:.8rem;animation:zz 2s steps(3) infinite}
@keyframes zz{0%{opacity:0;transform:translateY(6px)}50%{opacity:1}100%{opacity:0;transform:translateY(-8px)}}
.spark{position:absolute;width:10px;height:10px;animation:tw 1.2s steps(2) infinite}
@keyframes tw{50%{opacity:.15}}
.confetti{position:absolute;width:7px;height:7px;border-radius:2px;pointer-events:none;animation:conf 1.2s ease-out forwards}
@keyframes conf{0%{opacity:0;transform:translateY(10px) rotate(0)}20%{opacity:1}100%{opacity:0;transform:translateY(-40px) rotate(200deg)}}
.pop{position:absolute;bottom:70px;left:50%;width:16px;height:14px;pointer-events:none;animation:pop .9s ease-out forwards}
.pop.xp{width:auto;height:auto;font-size:.72rem;white-space:nowrap}
@keyframes pop{0%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,-48px)}}
.meters{display:grid;grid-template-columns:1fr 1fr;gap:0 10px;margin-top:4px;font-size:.7rem;line-height:1.6}
.meter{display:flex;justify-content:space-between;gap:4px;min-width:0}
.meter span:first-child{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.meter span:last-child{flex:none}
.xp{display:flex;align-items:center;gap:6px;margin-top:5px;font-size:.66rem}
.xpbar{flex:1;height:8px;border:2px solid var(--lcd-ink);border-radius:2px;padding:1px}
.xpbar i{display:block;height:100%;background:var(--lcd-ink);width:0;transition:width .4s steps(6)}
.dev-btns{display:flex;justify-content:center;gap:18px;margin-top:12px}
.dev-btns button{border:none;background:none;padding:0;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;font-size:.68rem;color:#8E4565;font-weight:700}
.dev-btns .knob{width:38px;height:38px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FFF6D8,#F3C55A 70%);box-shadow:0 4px 0 #C99A33,inset 0 -2px 0 rgba(0,0,0,.08)}
.dev-btns button[aria-pressed="true"] .knob{transform:translateY(3px);box-shadow:0 1px 0 #C99A33}
#nudge{margin:10px 0 6px;text-align:center}
#nudge:empty{margin:0}
.nudgebtn{border:none;background:var(--card);border-radius:999px;padding:8px 16px;font-size:.88rem;font-weight:700;cursor:pointer;box-shadow:0 2px 0 var(--line)}
.door{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:1px dashed var(--line);background:transparent;border-radius:14px;padding:12px;font-size:.95rem;color:var(--sub);cursor:pointer;margin:4px 0 12px}
.door svg{width:26px;height:26px}
.fold{padding:0;overflow:hidden}
.fold>.fh{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;border:none;background:none;padding:15px 16px;font-size:1.05rem;font-weight:700;cursor:pointer;text-align:left;list-style:none}
.fold>.fh::-webkit-details-marker{display:none}
.fold>.fh .sub{font-weight:500;color:var(--sub);font-size:.8rem;margin-left:auto;white-space:nowrap}
.fold>.fh .chev{flex:none;width:10px;height:10px;border:solid var(--sub);border-width:0 2px 2px 0;transform:rotate(45deg);margin:0 4px 4px 6px;transition:transform .2s}
.fold[open]>.fh .chev{transform:rotate(-135deg);margin-bottom:-2px}
.fold>.fb{padding:0 14px 14px}
.fold:not([open])>.fb{display:none}
.vision{font-size:.9rem;color:var(--sub);text-align:center;margin:-4px 0 10px}
.vision b{color:var(--ink)}
.cheer{font-size:.84rem;text-align:center;margin:8px 0 0;color:#9C4D6E}
.mini{font-size:.8rem;color:var(--sub);text-align:center;margin:0 0 10px}

/* ===== カード共通 ===== */
.card{background:var(--card);border-radius:18px;padding:14px;margin-bottom:12px;box-shadow:0 2px 0 var(--line)}
.card h3{margin:0 0 8px;font-size:.95rem}
.hint{font-size:.84rem;color:var(--sub);margin:0 0 10px;line-height:1.7}
.datenav{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.datenav div{text-align:center;line-height:1.25}
.datenav b{font-size:1rem}.datenav small{display:block;color:var(--sub);font-size:.72rem}
.navbtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-size:1.1rem;cursor:pointer}
.navbtn:disabled{opacity:.3;cursor:default}

/* きょうの合計 */
.total{text-align:center}
.total .big{font-family:var(--pixel);font-size:3rem;line-height:1.1;margin:2px 0}
.total .goal{font-size:.92rem;color:var(--sub)}
.goalbar{height:14px;border-radius:999px;background:var(--line);overflow:hidden;margin:10px 0 6px}
.goalbar i{display:block;height:100%;width:0;background:#F59BB0;border-radius:999px;transition:width .5s}
.goalbar.done i{background:#E8B84A}
.gsum{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 12px;font-size:.78rem;color:var(--sub)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px;vertical-align:0}

/* タイマー */
.items{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.item{display:flex;align-items:center;gap:10px;text-align:left;border:2px solid transparent;background:var(--bg);border-radius:12px;padding:11px 12px;font-size:.98rem;cursor:pointer;min-height:44px;line-height:1.3}
.item .box{flex:none;width:18px;height:18px;border:2px solid var(--g);border-radius:4px;display:grid;place-items:center}
.item.on{border-color:var(--g)}
.item.on .box{background:var(--g)}
.item.on .box::after{content:"";width:5px;height:9px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.chips-g{margin-bottom:8px}
.chips-g small{display:block;font-size:.78rem;color:var(--sub);margin-bottom:4px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:2px solid color-mix(in srgb,var(--g) 55%,transparent);background:color-mix(in srgb,var(--g) 12%,var(--card));border-radius:999px;padding:9px 15px;font-size:.98rem;cursor:pointer;min-height:44px}
.chip[aria-pressed="true"]{background:var(--g);border-color:var(--g);color:#fff;font-weight:700}
.clock{font-family:var(--pixel);font-size:2.6rem;text-align:center;line-height:1.1;margin:6px 0 2px;font-variant-numeric:tabular-nums}
.running-name{text-align:center;font-weight:700}
.bigbtn{display:block;width:100%;border:none;border-radius:999px;padding:16px;font-size:1.12rem;font-weight:900;cursor:pointer;margin-top:10px;
  background:linear-gradient(135deg,#F7C960,#E8A93C);color:#4A3214;box-shadow:0 4px 0 #C98F2C}
.bigbtn.stop{background:linear-gradient(135deg,#F7A8BC,#E8829E);color:#fff;box-shadow:0 4px 0 #C4627E}
.bigbtn:disabled{opacity:.45;cursor:default}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:8px 0}
.quick button{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 0;font-size:.88rem;cursor:pointer}

/* 記録リスト */
.loglist{list-style:none;margin:0;padding:0}
.loglist li{border-top:1px solid var(--line);padding:9px 0;font-size:.88rem}
.loglist li:first-child{border-top:none}
.loglist .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.loglist .meta{color:var(--sub);font-size:.74rem}
.loglist .memo{margin-top:3px;white-space:pre-wrap;word-break:break-word;font-size:.84rem;background:var(--bg);border-radius:8px;padding:5px 8px}

/* ===== ドラクエ窓 ===== */
.dq{background:var(--dq);color:#fff;border:3px solid #fff;border-radius:8px;box-shadow:0 0 0 3px var(--dq);font-family:var(--pixel);padding:12px 14px;margin:3px 3px 14px;line-height:1.7}
.dq h3{margin:0 0 6px;font-size:.95rem;font-weight:400;color:#FFE08A}
.dq p{margin:0 0 8px;font-size:.9rem}
.dq .small{font-size:.74rem;color:#CFC8DA}
.cmd{display:block;width:100%;text-align:left;background:none;border:none;color:#fff;font-family:var(--pixel);font-size:1.05rem;padding:10px 6px 10px 26px;cursor:pointer;position:relative;border-radius:4px;line-height:1.45}
.cmd::before{content:"";position:absolute;left:8px;top:50%;margin-top:-6px;border:6px solid transparent;border-left:9px solid #fff;opacity:0}
.cmd:hover::before,.cmd:focus-visible::before{opacity:1}
.cmd:focus-visible{outline:none;background:rgba(255,255,255,.08)}
.cmd.done{color:#8E879A;text-decoration:line-through}
.cmd.done::after{content:"CLEAR";position:absolute;right:6px;top:9px;font-size:.66rem;color:#FFE08A;text-decoration:none}
.bossbtn{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:none;cursor:pointer;background:linear-gradient(135deg,#3B2A55,#6B4B8F);color:#fff;border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 4px 0 #2B1E40}
.bossbtn svg{width:56px;height:56px;flex:none}
.bossbtn b{display:block;font-size:1.1rem}.bossbtn small{font-size:.84rem;opacity:.85}

/* ===== ふりかえり ===== */
.bars{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end;height:140px;margin:6px 0 4px}
.bar{display:flex;flex-direction:column-reverse;align-items:stretch;height:100%;justify-content:flex-start}
.bar .stack{display:flex;flex-direction:column-reverse;border-radius:6px 6px 2px 2px;overflow:hidden;background:var(--line);min-height:3px}
.bar .stack i{display:block}
.bar .v{text-align:center;font-family:var(--pixel);font-size:.62rem;color:var(--sub);margin-bottom:2px;white-space:nowrap}
.barlbl{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center;font-size:.72rem;color:var(--sub)}
.barlbl .today{color:var(--ink);font-weight:900}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:.74rem;color:var(--sub);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--bg);border-radius:12px;padding:8px;text-align:center}
.stat b{display:block;font-size:1.05rem;font-family:var(--pixel);font-weight:400}
.stat small{font-size:.7rem;color:var(--sub)}

/* ===== 設定 ===== */
label.f{display:block;font-size:.8rem;color:var(--sub);margin:0 0 4px}
.in{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:9px 10px;font-family:inherit;font-size:1rem}
textarea.in{min-height:70px;font-size:.9rem;resize:vertical}
.row{display:flex;gap:6px;align-items:center;margin-bottom:6px}
.row .in{flex:1;min-width:0}
.btn{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:10px 18px;font-size:.95rem;cursor:pointer;font-weight:700}
.btn.primary{border:none;background:linear-gradient(135deg,#F7C960,#E8A93C);color:#4A3214;box-shadow:0 3px 0 #C98F2C}
.btn.sm{padding:6px 12px;font-size:.78rem}
.btn.del{color:var(--sub);font-weight:500}
.btn.armed{background:#E4877F;color:#fff;border-color:#E4877F}
.swatches{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 8px}
.sw{width:28px;height:28px;border-radius:50%;border:3px solid transparent;cursor:pointer;padding:0}
.sw[aria-pressed="true"]{border-color:var(--ink)}
.gedit{border:2px solid color-mix(in srgb,var(--g) 50%,transparent);border-radius:14px;padding:10px;margin-bottom:10px}
.btnrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.banner{background:var(--card);border-left:4px solid #F59BB0;border-radius:18px;padding:14px;margin-bottom:12px}
.banner b{display:block;margin-bottom:4px}
.card.toi{border-left:4px solid var(--gold)}
.toihead{display:flex;justify-content:space-between;font-size:.78rem;color:var(--sub);margin-bottom:4px}
.toinum{font-family:var(--pixel)}
.toiq{margin:0 0 8px;font-size:1.12rem;font-weight:700;line-height:1.65}
.toih{margin:0 0 10px;font-size:.9rem;color:var(--sub);background:var(--bg);border-radius:8px;padding:5px 9px}
.toimark[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:#4A3214}
.note{font-size:.74rem;color:var(--sub);text-align:center;margin:18px 4px 0;line-height:1.7}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--dq);color:#fff;font-family:var(--pixel);font-size:.85rem;padding:8px 16px;border:2px solid #fff;border-radius:8px;z-index:60;max-width:90vw;text-align:center}

/* ===== モーダル ===== */
.modal{position:fixed;inset:0;background:rgba(40,30,50,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal .box{background:var(--card);border-radius:20px;padding:18px;width:min(100%,420px);max-height:88vh;overflow:auto}
.modal h2{margin:0 0 8px;font-size:1.05rem}
.modal .acts{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;margin-top:14px}
.evo svg{width:120px;height:120px;display:block;margin:0 auto 6px}

/* ===== ボス戦 ===== */
.battle{position:fixed;inset:0;background:#000;color:#fff;z-index:40;display:flex;flex-direction:column;font-family:var(--pixel);
  padding:calc(12px + env(safe-area-inset-top,0px)) 12px calc(12px + env(safe-area-inset-bottom,0px))}
.battle .inner{max-width:470px;width:100%;margin:0 auto;display:flex;flex-direction:column;height:100%}
.bstatus{display:flex;justify-content:space-between;gap:10px}
.bstatus .dq{flex:1;margin:3px;padding:6px 10px;font-size:.82rem;line-height:1.5}
.field{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:150px;position:relative}
.monster{width:150px;height:150px;transition:transform .3s,opacity .6s,filter .3s}
.monster svg{width:100%;height:100%}
.monster.shake{animation:shake .35s steps(4)}
.monster.flash{filter:brightness(3)}
.monster.gone{opacity:0;transform:scale(.2) translateY(-30px)}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.mname{margin-top:8px;font-size:.9rem}
.hpbar{width:150px;height:8px;border:2px solid #fff;border-radius:2px;padding:1px;margin-top:4px}
.hpbar i{display:block;height:100%;background:#7FE08A;transition:width .5s steps(8)}
.dmg{position:absolute;top:30%;font-size:1.4rem;color:#FFE08A;animation:pop .9s ease-out forwards;left:50%}
.lightball{position:absolute;width:14px;height:14px;background:#FFE08A;border-radius:50%;box-shadow:0 0 18px 8px rgba(255,224,138,.6);animation:rise 1.6s ease-out forwards}
@keyframes rise{0%{opacity:0;transform:translateY(20px)}30%{opacity:1}100%{opacity:0;transform:translateY(-90px)}}
.msg{min-height:84px;font-size:1.05rem;line-height:1.75;white-space:pre-wrap}
.cmds.grid{display:grid;grid-template-columns:1fr 1fr}
.breath{width:70px;height:70px;border-radius:50%;border:3px solid #FFE08A;margin:4px auto 8px;animation:breath 8s ease-in-out infinite}
@keyframes breath{0%,100%{transform:scale(.6)}50%{transform:scale(1)}}
.scorerow{display:grid;grid-template-columns:repeat(11,1fr);gap:4px;margin-top:4px}
.scorebtn{background:#000;color:#fff;border:2px solid #fff;border-radius:6px;padding:8px 0;font-family:var(--pixel);font-size:.95rem;cursor:pointer;min-height:40px}
.scorebtn:hover,.scorebtn:focus-visible{background:#fff;color:#000;outline:none}
.bin{width:100%;background:#000;color:#fff;border:2px solid #fff;border-radius:6px;padding:8px;font-family:var(--pixel);font-size:.95rem;min-height:70px;resize:vertical}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}
}
</style>
</head>
<body>
<main>
  <div class="device">
    <div class="dev-title" id="devTitle">エゴ育成ゲーム</div>
    <div class="lcd-frame">
      <div class="lcd" id="lcd">
        <div class="lcd-top"><span id="lvl"></span><span id="lcdToday"></span></div>
        <div class="stage-area" id="stageArea">
          <div class="bubble" id="bubble"></div>
          <div class="pet" id="pet" role="img"></div>
          <div class="typelabel" id="typeLabel"></div>
        </div>
        <div class="meters" id="meters"></div>
        <div class="xp"><div class="xpbar"><i id="xpfill"></i></div><span id="xptext"></span></div>
      </div>
    </div>
    <div class="dev-btns">

  const from=D.start>dk(st)?parseK(D.start):st, days=Math.round((en-from)/864e5)+1;
  const daysLeft=Math.round((en-parseK(k))/864e5)+1;

  const done=charmDoneSet(k,false), {target, daysLeft}=charmTarget(k);
  let rest=CHARM.map((_,i)=>i).filter(i=>!done.has(i));

function seeded(seed){ return ()=>{ seed|=0; seed=seed+0x6D2B79F5|0; let t=Math.imul(seed^seed>>>15,1|seed); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }

function addLog(at, min, g, item, memo){
  min=Math.min(MAX_MIN,Math.round(min)); if(!(min>0)) return;
  const before=dayMin(todayK());
  D.logs.push({id:uid(), at, min, g:g.id, i:item.id, n:item.name, memo:str(memo,300)});
  afterChange(min);
  const nowMin=dayMin(todayK());
  celebrate(before<D.goal && nowMin>=D.goal);
  const cheer=fill(pick(LINES.cheer), min);
  setTimeout(()=>toast(before<D.goal && nowMin>=D.goal ? '今日の目標 達成！ '+cheer : cheer),300);
}

// ---------- おしらせ（通知）----------
// スマホの通知は https の置き場所＋ホーム画面に追加したときに動く。ページが閉じている間は
// 端末側の制約で時刻ぴったりは保証できないので、開いたときにも必ず出す（取りこぼし防止）。
const canNotify = () => 'Notification' in window && 'serviceWorker' in navigator && /^https?:$/.test(location.protocol);
async function swReg(){ try{ return await navigator.serviceWorker.ready; }catch(e){ return null; } }
function notifyState(){ return !canNotify() ? 'unsupported' : Notification.permission; }
async function askNotify(){
  if(!canNotify()) return 'unsupported';
  try{ return await Notification.requestPermission(); }catch(e){ return 'denied'; }
}
async function showNote(title, body, tag, extra){
  const reg=await swReg(); if(!reg || Notification.permission!=='granted') return false;
  try{ await reg.showNotification(title, Object.assign({body, tag, icon:'icon-192.png', badge:'icon-192.png', lang:'ja', renotify:false}, extra||{})); return true; }catch(e){ return false; }
}
async function closeNote(tag){ const reg=await swReg(); if(!reg) return; try{ (await reg.getNotifications({tag})).forEach(n=>n.close()); }catch(e){} }
// タイマー中の通知（#3）
async function timerNotify(){
  if(!D.running){ closeNote('timer'); return; }
  const d=new Date(D.running.at), m=Math.floor(elapsedMs()/60000);
  await showNote(D.running.n+'で育て中'+(D.running.paused?'（一時停止）':''), (m?m+'分 ':'')+'（'+pad(d.getHours())+':'+pad(d.getMinutes())+'〜）タップして ストップ', 'timer', {silent:true, requireInteraction:true, data:{open:'today'}});
}

// 毎日のおしらせ（#2）：設定時刻を過ぎていて、きょうまだ出していなければ出す
let remindT=null;
function todayToi(){ const t=toiOf(todayK()); return t?t.q:''; }
async function fireRemind(){
  const n=D.notify; if(!n.on || !canNotify() || Notification.permission!=='granted') return;
  if(n.last===todayK()) return;
  const [h,mi]=n.time.split(':').map(Number); const now=new Date();
  if(now.getHours()*60+now.getMinutes() < h*60+mi) return;
  const q=todayToi(), m=dayMin(todayK());
  const cf=(D.charmOn&&CHARM.length)?'\n'+CH.title+'：今日できたのは？（'+charmFocus(todayK()).filter(i=>(D.charm[todayK()]||[]).includes(i)).length+'/'+charmFocus(todayK()).length+'）':'';
  const ok=await showNote('きょうの問い', q+(m?'\n（きょう '+fmtMin(m)+' そだてた）':'')+cf+(D.vision?'\n'+fill(pick(LINES.cheerIdle)):''), 'daily', {data:{open:'today'}});
  if(ok){ n.last=todayK(); save(); }
  syncRemindCfg();
}
function amBody(){ const f=charmFocus(todayK()); const note=charmNoteBefore(todayK()); return (note?CH.tomorrowFrom+note+'\n':'')+f.slice(0,5).map(i=>'・'+CHARM[i].t).join('\n')+(f.length>5?'\n…ほか'+(f.length-5)+'つ':''); }
async function fireAm(){
  const n=D.notify; if(!n.amOn || !D.charmOn || !CHARM.length || !canNotify() || Notification.permission!=='granted') return;
  if(n.amLast===todayK()) return;
  const [h,mi]=n.amTime.split(':').map(Number); const now=new Date();
  const cur=now.getHours()*60+now.getMinutes(); if(cur < h*60+mi || now.getHours()>=12) return;
  const ok=await showNote(CH.morning.replace('{n}',charmFocus(todayK()).length), amBody(), 'morning', {data:{open:'today'}});
  if(ok){ n.amLast=todayK(); save(); }
}
async function syncRemindCfg(){
  try{ const reg=await swReg(); const n=D.notify; if(reg&&reg.active) reg.active.postMessage({type:'remind-config', on:n.on, time:n.time, last:n.last, q:todayToi(), amOn:n.amOn&&D.charmOn, amTime:n.amTime, amLast:n.amLast, amTitle:CH.morning.replace('{n}',charmFocus(todayK()).length), amBody:amBody()});
    if(reg && (n.on||n.amOn) && 'periodicSync' in reg){ try{ await reg.periodicSync.register('daily-remind',{minInterval:6*3600*1000}); }catch(e){} } }catch(e){}
}
let amT=null;
function scheduleRemind(){
  clearTimeout(remindT); clearTimeout(amT);
  const n=D.notify;
  if(n.amOn){ const [ah,am]=n.amTime.split(':').map(Number); const t=new Date(); t.setHours(ah,am,0,0); if(t<=Date.now()) t.setDate(t.getDate()+1); amT=setTimeout(()=>{ fireAm(); scheduleRemind(); }, Math.min(t-Date.now(),2147000000)); fireAm(); }
  if(!n.on){ syncRemindCfg(); return; }
  const [h,mi]=n.time.split(':').map(Number); const t=new Date(); t.setHours(h,mi,0,0);
  if(t<=Date.now()) t.setDate(t.getDate()+1);
  remindT=setTimeout(()=>{ fireRemind(); scheduleRemind(); }, Math.min(t-Date.now(), 2147000000));
  fireRemind();
}

  await say((R.safety||'つらすぎる ときは 右上の「にげる」で いつでも おわれます。\n一人で 向き合うのが つらかったら、まりへ DMしてね。'));
  await cmds(['わかった']);
  if(B.fled) return;
  await say('なにが あった？\n（かかなくても OK）');
  const ta=el('textarea',{class:'bin',maxlength:'400','aria-label':'なにがあったか'});
  const go=el('button',{class:'cmd'},'すすむ');
  $('#cmds').innerHTML=''; $('#cmds').className='cmds'; $('#cmds').append(ta,go);
  await new Promise(r=>go.onclick=r);
  if(B.fled) return;
  $('#cmds').innerHTML='';
  B.memo=ta.value.trim().slice(0,400);
  // ① どんな感情？
  await say('いま、どんな きもち？');
  const f=await cmds(CONFIG.feelings.map(x=>({label:x.label,v:x})),true);
  if(B.fled) return;
  B.feel=f.v.label; B.mon=f.v.mon; B.ans.push(f.v.label);
  $('#monster').innerHTML=monSVG(f.v.color); $('#mname').textContent=B.mon; $('#mhp').hidden=false;
  // 最初の点数
  await say(B.mon+' が あらわれた！');
  await cmds(['▼']); if(B.fled) return;
  await say(SD.score);
  let score=await scorePick(); if(B.fled) return;
  B.scores.push(score); B.mhp=Math.max(5,score*10); monHP();
  // ホイミ（呼吸）
  await say('まずは ホイミで じぶんを まもろう。');
  await cmds(['ホイミ（しんこきゅう）']); if(B.fled) return;
  for(let i=1;i<=3;i++){
    const ring=el('div',{class:'breath'}); $('#cmds').innerHTML=''; $('#cmds').append(ring);
    await say(`すって… はいて…（${i}/3）\nわっかに あわせて ゆっくり`);
    await cmds([i<3?'すった・はいた':'さいごの ひと呼吸'], false, ring); if(B.fled) return;
    B.hp=Math.min(B.maxHp,B.hp+8); meBox();
  }
  B.hp=B.maxHp; meBox();
  // ② セドナの輪：みとめる → 手放せる？ → 手放す？ → いつ？ → 何点？ → また手放す？
  let round=0;
  while(true){
    round++;
    await cmds(['たたかう']); if(B.fled) return;
    if(round===1){
      await say(SD.ack); const a1=await cmds(['はい','いいえ','わからない']); if(B.fled) return; B.ans.push('みとめる:'+a1); hit(8);
      await say(SD.ackReply[a1]||a1);
    }
    await say(SD.can); const a2=await cmds(['はい','いいえ','たぶん']); if(B.fled) return; B.ans.push('手放せる:'+a2); hit(a2==='はい'?15:8);
    await say(SD.canReply[a2]||a2);
    await say(SD.will); const a3=await cmds(['はい','いいえ']); if(B.fled) return; B.ans.push('手放す:'+a3); hit(a3==='はい'?15:6);
    await say(SD.willReply[a3]||a3);
    if(a3==='はい'){
      await say(SD.when); const a4=await cmds(['いま','あとで']); if(B.fled) return; B.ans.push('いつ:'+a4); hit(a4==='いま'?25:8);
      await say(SD.whenReply[a4]||a4);
    }
    await say(SD.score); const sc=await scorePick(); if(B.fled) return;
    B.scores.push(sc);
    const prev=score; score=sc; B.mhp=Math.max(0,score*10); monHP();
    if(score<prev){ const m=$('#monster'); m.classList.add('flash','shake'); setTimeout(()=>m.classList.remove('flash','shake'),400); }
    await say(prev>score ? (prev-score)+'点 かるくなった！（'+prev+'→'+score+'）' : prev===score ? 'まだ '+score+'点。それも 正直な こたえ' : score+'点。ふえても だいじょうぶ。感じきる とちゅう');
    if(score<=2 || round>=5){ break; }
    await say(SD.again); const a5=await cmds(['はい','きょうは ここまで']); if(B.fled) return;
    if(a5!=='はい'){ await say(SD.enough); break; }
  }
  // おわり
  $('#bRun').hidden=true;
  if(score<=2){
    $('#monster').classList.add('gone');
    for(let i=0;i<5;i++){ const bb=el('div',{class:'lightball',style:`left:${30+i*10}%;top:45%;animation-delay:${i*.15}s`}); $('#field').append(bb); setTimeout(()=>bb.remove(),2400); }
    await say(B.mon+'は ひかりの つぶに なった！\n'+SD.done);
  } else {
    await say(B.mon+'は すこし 小さくなった。\n（'+B.scores[0]+'点 → '+score+'点）');
  }
  await cmds(['▼']);
  D.battles.push({at:Date.now(), mon:B.mon, feel:B.feel, memo:B.memo, ans:B.ans, scores:B.scores}); save();
  const before=levelOf(totalXP()-CONFIG.xp.boss), after=levelOf(totalXP());
  await say('けいけんち '+CONFIG.xp.boss+'ポイント かくとく！'+(after>before?'\nレベルが '+after+'に あがった！':''));
  await cmds(['▼']);
  await say('けっかは どうでも いい。\nそれでも わたしは、じぶんの ために うごけた。');
  await cmds(['へやに もどる']);
  endBattle(true);

  function hit(n){ const d=Math.min(B.mhp,n); if(!d) return; B.mhp-=d; monHP(); const m=$('#monster'); m.classList.add('flash','shake'); setTimeout(()=>m.classList.remove('flash','shake'),400); const dn=el('div',{class:'dmg'},String(d)); $('#field').append(dn); setTimeout(()=>dn.remove(),950); }
}

function askImport(text){
  let d=null; try{ d=normalize(JSON.parse(text)); }catch(e){}
  if(!d){ toast('読み込めませんでした。書き出したファイルか確認してね'); return; }

    [{label:'やめる'},{label:'読み込む',primary:true,fn:()=>{ D=d; D.named=true; D.setup=true; save(); lastLevel=levelOf(totalXP()); renderAll(); toast('読み込みました'); }}]);
}
function b64e(s){ const bytes=new TextEncoder().encode(s); let bin=''; bytes.forEach(b=>bin+=String.fromCharCode(b)); return btoa(bin).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); }
function b64d(s){ s=s.replace(/-/g,'+').replace(/_/g,'/'); while(s.length%4) s+='='; const bin=atob(s); return new TextDecoder().decode(Uint8Array.from(bin,c=>c.charCodeAt(0))); }

function renderTab(){ ({today:renderToday,quest:renderQuest,review:renderReview,settings:renderSettings})[tab](); }
function renderAll(){ renderLCD(); renderTab(); }
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>showTab(b.dataset.tab));

let shownDay=todayK();
setInterval(()=>{
  if(todayK()!==shownDay){ if(viewDay===shownDay) viewDay=todayK(); shownDay=todayK(); renderAll(); }
  else if(D.running) renderLCD();
},60000);

// ---------- 起動 ----------
function askName(){
  const inp=el('input',{class:'in',maxlength:'10',value:D.pet,'aria-label':'なまえ'});
  const pic=el('div',{class:'evo'}); pic.innerHTML=petSVG(0,'normal');
  const box=el('div',null,pic,el('p',{style:'margin:0 0 6px;text-align:center'},WELCOME.meaning),el('p',{style:'margin:0 0 6px'},'たまごを ひろった！ なまえを つけてね。'),inp);
  modal('ようこそ', box, [{label:'つぎへ',primary:true,fn:()=>{ D.pet=inp.value.trim()||'エゴちゃん'; D.named=true; save(); setTimeout(askVision,60); }}]);
}
function askVision(){
  const inp=el('input',{class:'in',maxlength:'30',value:D.vision,placeholder:WELCOME.goalDefault,'aria-label':'ゴール'});
  const box=el('div',null,el('p',{style:'margin:0 0 6px'},WELCOME.goalAsk),inp,WELCOME.goalEx?el('p',{class:'hint',style:'margin:8px 0 0'},WELCOME.goalEx):null,
    el('p',{class:'hint',style:'margin:8px 0 0'},'あとから「せってい」で変えられます。メニューは最初から入っているので、すぐスタートできます。'));
  modal('ゴールを ひとこと', box, [{label:'つぎへ',primary:true,fn:()=>{ D.vision=inp.value.trim().slice(0,30)||WELCOME.goalDefault; D.visionAt=Date.now(); save(); setTimeout(askMonthGoal,60); }}]);
}
function askMonthGoal(){
  let chosen=D.monthGoal||10;
  const opts=[5,10,20,30,50,100];
  const grid=el('div',{class:'quick',style:'grid-template-columns:repeat(3,1fr)'});
  const custom=el('input',{class:'in',type:'number',inputmode:'numeric',min:'1',max:'300',placeholder:'じぶんで決める（時間）','aria-label':'月の目標（時間）',style:'margin-top:8px'});
  const paint=()=>{ [...grid.children].forEach(b=>{ b.style.background=+b.dataset.v===chosen?'var(--gold)':''; b.style.fontWeight=+b.dataset.v===chosen?'900':''; }); };
  opts.forEach(v=>grid.append(el('button',{'data-v':String(v),onclick:()=>{ chosen=v; custom.value=''; paint(); }},v+'時間')));
  custom.oninput=()=>{ const v=Math.round(+custom.value); if(v>0){ chosen=Math.min(300,v); paint(); } };
  paint();
  const box=el('div',null,el('p',{style:'margin:0 0 8px'},'ひと月に、どれくらい 自分を育てる？'),grid,custom,
    el('p',{class:'hint',style:'margin:8px 0 0'},'目安：10時間＝1日20分。あとから「設定」で変えられます。'));
  modal('月の目標', box, [{label:'はじめる',primary:true,fn:()=>{ D.monthGoal=chosen; D.setup=true; save(); renderAll(); showTab('today'); toast('「'+D.vision+'」へ、いってらっしゃい'); }}]);
}
renderAll(); liveFace();
(function boot(){
  const m=location.hash.match(/^#setup=([A-Za-z0-9_-]+)/);
  if(m){
    history.replaceState(null,'',location.pathname+location.search);
    let p=null; try{ p=JSON.parse(b64d(m[1])); }catch(e){}
    if(p && Array.isArray(p.g)){
      const list=p.g.slice(0,MAX_GENRES).map(g=>'<li>'+esc(str(g.n,12))+'：'+(Array.isArray(g.i)?g.i.slice(0,MAX_ITEMS).map(x=>esc(str(x,20))).join('、'):'')+'</li>').join('');
      modal('この設定で はじめる？', `<p>「${esc(str(p.t,24)||'エゴ育成ゲーム')}」の 育成メニュー：</p><ul style="padding-left:1.2em;font-size:.9rem">${list}</ul><p class="hint">いまの記録は のこります。メニューは あとから じぶんで 変えられます。</p>`,
        [{label:'やめる',fn:()=>{ if(!D.named) setTimeout(askName,50); }},{label:'この設定にする',primary:true,fn:()=>{
          D.title=str(p.t,24)||D.title;
          if(Number.isFinite(p.m)&&p.m>=5&&p.m<=MAX_MIN) D.goal=Math.round(p.m);
          if(Number.isFinite(p.mg)&&p.mg>0&&p.mg<=300) D.monthGoal=Math.round(p.mg);
          if(p.cc==='week'||p.cc==='month') D.charmCycle=p.cc;
          D.genres=p.g.slice(0,MAX_GENRES).map(g=>({id:uid(),name:str(g.n,12)||'ジャンル',color:PALETTE.some(x=>x.id===g.c)?g.c:'rose',items:(Array.isArray(g.i)?g.i:[]).slice(0,MAX_ITEMS).map(n=>({id:uid(),name:str(n,20)})).filter(i=>i.name)}));
          if(Array.isArray(p.q)){ const q=p.q.map(x=>str(x,30)).filter(Boolean).slice(0,MAX_QUESTS); if(q.length) D.questPool=q; }
          D.setup=true; save(); renderAll(); if(!D.named) setTimeout(askName,50);
        }}]);
      return;
    }
  }
  if(!D.named) askName();
})();

// ---------- オフライン対応（https のサーバーに置いたときだけ動く） ----------
if('serviceWorker' in navigator && /^https?:$/.test(location.protocol)){
  window.addEventListener('load',()=>{ navigator.serviceWorker.register('sw.js').then(()=>{ scheduleRemind(); if(D.running) timerNotify(); }).catch(()=>{}); });
}
})();
</script>
